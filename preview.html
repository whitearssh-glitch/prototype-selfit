<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SELFit – Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'ARCO';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://db.onlinewebfonts.com/t/e31fd2ef9bcf0adbb98de3b059d2b88a.woff2') format('woff2');
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 40%, #ffe4ec 100%); }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 40%, #ffe4ec 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100%;
      overflow-x: auto;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 414px;
      min-width: 414px;
      max-width: 100%;
      min-height: 100%;
      max-height: 844px;
      margin: 0 auto;
      padding: 0.75rem;
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 40%, #ffe4ec 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
    }
    @media (min-height: 800px) {
      .app { min-height: 667px; border-radius: 1.25rem; }
    }
    .app.app--step3-colors {
      background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 50%, #7986cb 100%) !important;
      border: 6px solid #5c6bc0 !important;
    }
    /* Header – no color box; text + divider only */
    .app-header {
      position: relative;
      width: 100%;
      min-width: 0;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 0.5rem 1rem;
      flex-shrink: 0;
      text-align: center;
      box-sizing: border-box;
      background: none;
    }
    .app-header-text {
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .app-header::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5px;
      background: linear-gradient(90deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      border-radius: 2px;
    }
    /* Step 3 theme: header text + divider */
    .app-header.app-header--step3 .app-header-text {
      background: linear-gradient(135deg, #9fa8da 0%, #5c6bc0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .app-header.app-header--step3::after {
      background: linear-gradient(90deg, #9fa8da 0%, #5c6bc0 100%);
    }
    .app-content { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .app-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-overlay > * { pointer-events: auto; }
    .corner-select-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 40%, #ffe4ec 100%);
      border: 6px solid #ad1457;
      border-radius: inherit;
      box-sizing: border-box;
    }
    .corner-select-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      max-width: min(95vw, 22rem);
    }
    .corner-select-divider {
      width: 100%;
      max-width: 14rem;
      margin: 0;
      border: none;
      border-top: 1px solid rgba(126, 87, 194, 0.5);
    }
    .corner-select-version {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .corner-select-version-heading {
      margin: 0 0 0.2rem 0;
      padding: 0.25rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    .corner-select-version-heading--ver2 {
      background: linear-gradient(135deg, #9575cd 0%, #6a1b9a 100%);
    }
    .corner-select-version-heading--test {
      background: linear-gradient(135deg, #78909c 0%, #546e7a 100%);
    }
    .corner-select-group { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .corner-select-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
    .corner-select-btn {
      min-width: 10rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 1rem;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .corner-select-btn:hover { filter: brightness(1.08); }
    .corner-select-btn--step3 {
      background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 35%, #9fa8da 65%, #5c6bc0 100%);
    }
    .corner-select-row--tts-test { width: 100%; justify-content: center; margin-top: 0.35rem; }
    /* RT8/RT10: 단어별 프레임 · RT9: 한글 단일 프레임 */
    .realtalk-hints-frames-row {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: center;
      gap: 0.45rem;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    .realtalk-hint-word-frame {
      flex: 1 1 28%;
      min-width: 0;
      max-width: 100%;
      padding: 0.5rem 0.55rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(92, 107, 192, 0.35);
      box-shadow: 0 6px 14px rgba(121, 134, 203, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .realtalk-hint-word-frame-text {
      display: block;
      font-size: 0.82rem;
      line-height: 1.2;
      font-weight: 800;
      color: #283593;
      text-align: center;
      word-break: break-word;
    }
    @keyframes realtalk-hint-frame-glow {
      0% { box-shadow: 0 6px 14px rgba(121, 134, 203, 0.14), 0 0 0 rgba(236, 64, 122, 0); }
      50% { box-shadow: 0 8px 18px rgba(121, 134, 203, 0.22), 0 0 16px rgba(236, 64, 122, 0.22); }
      100% { box-shadow: 0 6px 14px rgba(121, 134, 203, 0.14), 0 0 0 rgba(236, 64, 122, 0); }
    }
    .realtalk-hint-word-frame--glow { animation: realtalk-hint-frame-glow 1.8s ease-in-out infinite; }
    .rt9-hint-frame {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding: 0.55rem 0.85rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(92, 107, 192, 0.32);
      box-shadow: 0 6px 14px rgba(121, 134, 203, 0.16);
      font-size: 0.88rem;
      line-height: 1.35;
      font-weight: 700;
      color: #1a237e;
      text-align: center;
    }
    .rt9-hint-text-sub { font-size: 0.82rem; font-weight: 600; color: #3949ab; }
    .openai-voice-test-screen { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-radius: inherit; }
    .openai-voice-test-inner { flex: 1; min-height: 0; overflow: auto; padding: 0.75rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .openai-voice-test-back { align-self: flex-start; border: none; background: rgba(255, 255, 255, 0.55); color: #880e4f; font-size: 0.9rem; font-weight: 600; padding: 0.35rem 0.65rem; border-radius: 999px; cursor: pointer; }
    .openai-voice-test-back:hover { background: rgba(255, 255, 255, 0.85); }
    .openai-voice-test-title { margin: 0; font-size: 1.15rem; font-weight: 800; background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .openai-voice-test-hint { margin: 0; font-size: 0.68rem; line-height: 1.35; color: #666; word-break: break-word; }
    .openai-voice-test-label { font-size: 0.75rem; font-weight: 600; color: #880e4f; }
    .openai-voice-test-textarea { width: 100%; resize: vertical; min-height: 3.2rem; padding: 0.5rem 0.65rem; border-radius: 0.65rem; border: 1px solid rgba(173, 20, 87, 0.35); font-size: 0.95rem; font-family: inherit; box-sizing: border-box; }
    .openai-voice-test-actions { display: flex; gap: 0.5rem; }
    .openai-voice-test-stop { border: none; padding: 0.4rem 0.9rem; border-radius: 999px; font-weight: 600; font-size: 0.85rem; cursor: pointer; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); color: #880e4f; }
    .openai-voice-test-stop:disabled { opacity: 0.45; cursor: default; }
    .openai-voice-test-error { margin: 0; font-size: 0.8rem; color: #c62828; }
    .openai-voice-test-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
    .openai-voice-test-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 0.55rem; background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(173, 20, 87, 0.12); }
    .openai-voice-test-name { font-size: 0.9rem; font-weight: 600; color: #333; font-family: ui-monospace, monospace; }
    .openai-voice-test-play { flex-shrink: 0; border: none; padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #f48fb1 0%, #ec407a 100%); color: #fff; }
    .openai-voice-test-play:hover { filter: brightness(1.05); }
    .corner-intro-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 40%, #ffe4ec 100%);
      border: 6px solid #ad1457;
      border-radius: inherit;
      box-sizing: border-box;
      cursor: pointer;
    }
    .corner-intro-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .corner-intro-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.75rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }
    .corner-intro-title {
      margin: 0;
      font-size: 2.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 40%, #d81b60 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .corner-intro-screen--step3 {
      background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 50%, #7986cb 100%);
      border-color: #5c6bc0;
    }
    .corner-intro-screen--step3 .corner-intro-step {
      background: linear-gradient(135deg, #e1bee7 0%, #7986cb 100%);
    }
    .corner-intro-screen--step3 .corner-intro-title {
      background: linear-gradient(135deg, #9fa8da 0%, #5c6bc0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .screen-content--step3-colors {
      flex: 1;
      min-height: 0;
      background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 50%, #7986cb 100%);
      border: 6px solid #5c6bc0;
      border-radius: inherit;
      box-sizing: border-box;
    }
    .topic-box--step3 {
      background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 50%, #7986cb 100%);
      color: #37474f;
      font-weight: 600;
    }
    .topic-box {
      padding: 0.4rem 1rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      border: none;
      font-size: 0.9rem;
      color: #fff;
      text-align: center;
      align-self: center;
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }
    .screen-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
    }
    .screen-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 0;
      width: 100%;
      padding-top: 0.5rem;
    }
    .screen-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 320px;
      width: 100%;
    }
    .screen-main--vertical-center { justify-content: center; }
    .screen-bottom {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      width: 100%;
      margin-top: 0.5rem;
      padding-bottom: 0.5rem;
      flex-shrink: 0;
    }
    .screen-next {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-next--top-right {
      position: absolute;
      top: -0.5rem;
      right: 0;
    }
    .text-box {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      border-radius: 1.75rem;
      border: 2px solid transparent;
      background: linear-gradient(white, white) padding-box,
                  linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%) border-box;
      background-origin: border-box;
      background-clip: padding-box, border-box;
      font-size: 1.1rem;
      line-height: 1.5;
      text-align: center;
      white-space: pre-line;
      box-sizing: border-box;
    }
    .text-box-two-lines { display: flex; flex-direction: column; gap: 0.25rem; }
    .text-box-two-lines .text-box-line {
      display: block;
      font-weight: bold;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .main-text {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      padding: 1rem;
    }
    .main-text--two-lines { margin: 0; padding: 0 1rem; line-height: 1.2; }
    .main-text.main-text--sub { font-size: 1.1rem; color: #666; margin-top: -0.2em; }
    .main-text-blank-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4rem;
      height: 1.4em;
      margin-left: 0.2em;
      padding: 0 0.4em;
      vertical-align: middle;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.95);
      box-sizing: border-box;
    }
    .main-text-blank-box__hint {
      color: #aaa;
      font-size: inherit;
      font-weight: inherit;
    }
    .main-text-fill--cyan {
      background: linear-gradient(135deg, #26c6da 0%, #5c6bc0 50%, #7e57c2 100%);
      background-repeat: no-repeat;
      background-position: 0 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: main-text-gradient-fill 1.4s ease-out forwards;
    }
    .main-text--gradient-sequential {
      background: linear-gradient(90deg, #880e4f 0%, #ad1457 20%, #d81b60 40%, #26c6da 40%, #5c6bc0 70%, #7e57c2 100%);
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 0% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: main-text-gradient-fill 1.4s ease-out forwards;
    }
    .speed-display {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.25rem;
      width: 100%;
      padding: 0 0.5rem 0.25rem;
      margin-bottom: 0.25rem;
      flex-shrink: 0;
    }
    .speed-display-item {
      font-size: 0.7rem;
      font-weight: 600;
      color: #880e4f;
      padding: 0.2rem 0.5rem;
      border-radius: 0.4rem;
      background: rgba(255, 255, 255, 0.7);
    }
    .speed-display-item--slow {
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      color: #fff;
    }
    .speed-display--fast-active .speed-display-item--slow {
      background: #fff;
      color: #880e4f;
    }
    .speed-display--fast-active .speed-display-item--fast {
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      color: #fff;
    }
    .speed-display-sep { font-size: 0.65rem; color: #ad1457; opacity: 0.8; }
    .main-text--gradient {
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      background-repeat: no-repeat;
      background-position: 0 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: main-text-gradient-fill 1.4s ease-out forwards;
    }
    @keyframes main-text-gradient-fill {
      from { background-size: 0% 100%; }
      to { background-size: 100% 100%; }
    }
    .main-text--correction-blink {
      animation: correction-blink 1s ease-in-out;
    }
    @keyframes correction-blink {
      0%, 100% { opacity: 1; }
      25% { opacity: 0.2; }
      50% { opacity: 1; }
      75% { opacity: 0.2; }
    }
    .teacher-image {
      max-width: 320px;
      max-height: 400px;
      width: 100%;
      object-fit: contain;
    }
    .teacher-image--shake {
      animation: teacher-shake 1.2s ease-in-out infinite;
    }
    @keyframes teacher-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .screen1-tap-hint {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
    }
    .next-btn {
      padding: 0.35rem 0.75rem;
      border: none;
      border-radius: 0.55rem;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.15em;
      flex-shrink: 0;
    }
    .next-btn:hover:not(:disabled) { filter: brightness(1.05); }
    .next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .mic-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(173, 20, 87, 0.35);
      transition: transform 0.15s ease;
    }
    .mic-btn:hover { transform: scale(1.05); }
    .mic-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .mic-btn svg { width: 28px; height: 28px; }
    .checkmark-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.3s ease;
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0); }
      70% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
    .checkmark-popup svg { width: 48px; height: 48px; color: #2e7d32; }
    .roleplay-complete-popup svg { width: 48px; height: 48px; color: #7986cb; }
    .wrong-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.3s ease;
    }
    .wrong-popup svg { width: 48px; height: 48px; color: #c62828; }
    .stt-debug-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 11px;
      font-family: monospace;
      z-index: 9999;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .speed-up-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, #880e4f 0%, #ad1457 50%, #d81b60 100%);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      animation: pop 0.3s ease;
      pointer-events: auto;
    }

    /* Screen 7 only: Good! stamp popup when Next is clicked */
    .screen7-stamp-popup {
      position: absolute;

    function playDingDong() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, start, duration) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.2, start);
          gain.gain.exponentialRampToValueAtTime(0.01, start + duration);
          osc.start(start);
          osc.stop(start + duration);
        }
        playTone(523, 0, 0.15);
        playTone(659, 0.2, 0.2);
      } catch (e) {}
    }

    function playNotificationSound() {

        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.25, 0);
        gain.gain.exponentialRampToValueAtTime(0.01, 0.1);
        osc.start(0);
        osc.stop(0.1);
      } catch (e) {}
    }
